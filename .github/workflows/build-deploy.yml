# Builds and publishes the server image on a push to main, then deploys that exact image to the VPS.
# No other branch, tag, pull request or manual event builds or deploys.
name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Server image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aurora21-ultimateteam-server" >> "$GITHUB_ENV"
          echo "CLIENT_VERSION=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: ultimateteam
          file: ultimateteam/deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The client pack inside the image is versioned like the image (sha-<7>).
          build-args: CLIENT_VERSION=${{ env.CLIENT_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Only a push to main deploys; deploy.yml checks this again itself.
  deploy:
    name: Deploy to the VPS
    needs: image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
