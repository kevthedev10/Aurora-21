# Prometheus for the hosted stack (compose service "prometheus", monitoring profile). Every target is on loopback:
# on the VPS the monitoring services use host networking; in compose.local.yaml they share Prometheus's namespace.
# The server pushes its own metrics over OTLP (--web.enable-otlp-receiver); see ../README.md, Monitoring.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  # Becomes a label on every server series, so a dashboard can tell deploys apart.
  promote_resource_attributes: [service.version]

storage:
  tsdb:
    # OTLP pushes can arrive slightly out of order around restarts.
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
  - job_name: postgres
    static_configs:
      - targets: ["127.0.0.1:9187"]
